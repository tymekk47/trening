<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FitAI Pro</title>
    
    <!-- Ikona -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2964/2964095.png">
    
    <!-- Tailwind & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* True Black OLED Base */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Glassmorphism Cards */
        .glass-card {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
        }

        /* Bottom Nav Glass */
        .bottom-nav {
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Floating Action Button (Scanner) */
        .fab-btn {
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.4);
            transform: translateY(-24px);
            border: 6px solid #000000;
            transition: transform 0.2s;
        }
        .fab-btn:active { transform: translateY(-20px) scale(0.95); }

        /* Nav Items */
        .nav-item {
            color: rgba(255, 255, 255, 0.4);
            transition: color 0.3s ease;
        }
        .nav-item.active { color: #34d399; }

        /* View Transitions */
        .view-section { 
            display: none; 
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding-bottom: 120px; /* Space for nav */
        }
        .view-section.active { display: block; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hide Default Inputs */
        input[type="file"] { display: none; }

        /* Dynamic Island Safe Toasts */
        #toast-container {
            position: fixed;
            top: calc(env(safe-area-inset-top, 45px) + 10px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 350px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: rgba(255, 255, 255, 0.95);
            color: #000000;
            padding: 14px 20px;
            border-radius: 99px;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1), fadeOut 0.4s ease-in 3.5s forwards;
            backdrop-filter: blur(10px);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }

        /* Spinner */
        .loader {
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top: 3px solid #10b981;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- VIEW: DASHBOARD -->
    <main id="view-dashboard" class="view-section active p-5">
        <header class="mb-8 pt-4">
            <h1 class="text-3xl font-extrabold tracking-tight">Twoje Makro</h1>
            <p class="text-sm text-gray-400 mt-1" id="date-display">Dziś</p>
        </header>

        <!-- Main Calories Card -->
        <div class="glass-card p-6 mb-6 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500 rounded-full blur-3xl opacity-20 -mr-10 -mt-10"></div>
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Spożyte Kalorie</h2>
            <div class="flex items-baseline gap-2">
                <span class="text-5xl font-black" id="dash-kcal">0</span>
                <span class="text-lg text-gray-400 font-semibold">/ 2500 kcal</span>
            </div>
            
            <div class="w-full bg-white/10 h-3 rounded-full mt-6 overflow-hidden">
                <div class="bg-gradient-to-r from-emerald-400 to-emerald-500 h-full rounded-full transition-all duration-700 ease-out" style="width: 0%" id="dash-bar"></div>
            </div>
        </div>

        <!-- Macros Grid -->
        <div class="grid grid-cols-3 gap-4 mb-8">
            <div class="glass-card p-4 flex flex-col items-center justify-center relative overflow-hidden">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Białko</div>
                <div class="text-xl font-bold"><span id="dash-protein">0</span><span class="text-sm text-gray-400 ml-1">g</span></div>
            </div>
            <div class="glass-card p-4 flex flex-col items-center justify-center relative overflow-hidden">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Węgle</div>
                <div class="text-xl font-bold"><span id="dash-carbs">0</span><span class="text-sm text-gray-400 ml-1">g</span></div>
            </div>
            <div class="glass-card p-4 flex flex-col items-center justify-center relative overflow-hidden">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Tłuszcze</div>
                <div class="text-xl font-bold"><span id="dash-fat">0</span><span class="text-sm text-gray-400 ml-1">g</span></div>
            </div>
        </div>

        <button onclick="resetData()" class="w-full py-4 rounded-xl text-sm font-semibold text-gray-400 hover:bg-white/5 transition-colors flex items-center justify-center gap-2">
            <i class="fa-solid fa-rotate-right"></i> Rozpocznij nowy dzień
        </button>
    </main>

    <!-- VIEW: SCANNER -->
    <main id="view-scanner" class="view-section p-5">
        <header class="mb-8 pt-4">
            <h1 class="text-3xl font-extrabold tracking-tight">Skaner AI</h1>
            <p class="text-sm text-gray-400 mt-1">Zrób zdjęcie lub opisz posiłek.</p>
        </header>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <label class="glass-card p-6 flex flex-col items-center justify-center cursor-pointer active:bg-white/20 transition-colors">
                <div class="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mb-3 text-xl">
                    <i class="fa-solid fa-camera"></i>
                </div>
                <span class="font-bold text-sm">Zrób zdjęcie</span>
                <input type="file" accept="image/*" capture="environment" onchange="processImage(this)">
            </label>

            <label class="glass-card p-6 flex flex-col items-center justify-center cursor-pointer active:bg-white/20 transition-colors">
                <div class="w-12 h-12 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center mb-3 text-xl">
                    <i class="fa-solid fa-image"></i>
                </div>
                <span class="font-bold text-sm">Galeria</span>
                <input type="file" accept="image/*" onchange="processImage(this)">
            </label>
        </div>

        <div id="preview-container" class="hidden relative mb-6">
            <img id="preview-img" class="w-full h-48 object-cover rounded-[1.5rem] border border-white/10" src="">
            <button onclick="clearImage()" class="absolute top-3 right-3 bg-black/60 backdrop-blur-md text-white w-8 h-8 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="glass-card p-2 mb-8">
            <textarea id="scan-input" rows="3" class="w-full bg-transparent border-none text-white placeholder-gray-500 p-4 focus:ring-0 resize-none font-medium" placeholder="Opisz dodatki (np. 1 łyżka oliwy, garść orzechów...)"></textarea>
        </div>

        <button id="scan-btn" onclick="analyzeMeal()" class="w-full bg-white text-black font-extrabold py-4 rounded-2xl text-lg flex items-center justify-center gap-3 active:scale-95 transition-transform">
            <i class="fa-solid fa-wand-magic-sparkles text-emerald-500"></i>
            <span>Oblicz Kalorie</span>
            <div id="scan-loader" class="loader"></div>
        </button>
    </main>

    <!-- VIEW: SETTINGS -->
    <main id="view-settings" class="view-section p-5">
        <header class="mb-8 pt-4">
            <h1 class="text-3xl font-extrabold tracking-tight">Ustawienia</h1>
            <p class="text-sm text-gray-400 mt-1">Konfiguracja systemu.</p>
        </header>

        <div class="glass-card p-6">
            <h2 class="text-sm font-bold text-emerald-400 mb-2 uppercase tracking-wide">Klucz Gemini API</h2>
            <p class="text-xs text-gray-400 mb-5">
                Aplikacja działa w 100% lokalnie. Twój klucz jest szyfrowany w pamięci iPhone'a/Maca.
            </p>
            <input type="password" id="api-key" placeholder="AIzaSy..." class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-4 text-white placeholder-gray-600 focus:outline-none focus:border-emerald-500 transition-colors mb-4 font-mono">
            <button onclick="saveKey()" class="w-full bg-white/10 hover:bg-white/20 active:bg-white/30 text-white font-bold py-4 rounded-xl transition-colors">
                Zapisz Klucz
            </button>
        </div>
    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav fixed bottom-0 left-0 w-full z-50 px-8 py-3 flex justify-between items-center">
        <!-- Home -->
        <button onclick="nav('dashboard')" id="nav-btn-dashboard" class="nav-item active flex flex-col items-center w-16 pt-2">
            <i class="fa-solid fa-chart-simple text-xl mb-1"></i>
            <span class="text-[10px] font-bold">Start</span>
        </button>

        <!-- FAB Scanner -->
        <div class="relative w-16 flex justify-center">
            <button onclick="nav('scanner')" class="fab-btn absolute -top-10 w-16 h-16 rounded-full text-white flex items-center justify-center text-2xl">
                <i class="fa-solid fa-camera"></i>
            </button>
        </div>

        <!-- Settings -->
        <button onclick="nav('settings')" id="nav-btn-settings" class="nav-item flex flex-col items-center w-16 pt-2">
            <i class="fa-solid fa-gear text-xl mb-1"></i>
            <span class="text-[10px] font-bold">Opcje</span>
        </button>
    </nav>

    <script>
        /* === STATE & INIT === */
        let currentBase64 = null;
        const state = JSON.parse(localStorage.getItem('fitai_state')) || { 
            kcal: 0, protein: 0, carbs: 0, fat: 0, date: new Date().toDateString() 
        };

        window.onload = () => {
            const dateOpts = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('date-display').textContent = new Date().toLocaleDateString('pl-PL', dateOpts);
            
            if (state.date !== new Date().toDateString()) resetData(false);
            else updateUI();

            if (localStorage.getItem('fitai_api_key')) {
                document.getElementById('api-key').placeholder = "Klucz zapisany w urządzeniu";
            }
        };

        /* === NOTIFICATIONS === */
        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        /* === NAVIGATION === */
        function nav(view) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${view}`).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if (view !== 'scanner') {
                document.getElementById(`nav-btn-${view}`).classList.add('active');
            }
            window.scrollTo(0,0);
        }

        /* === IMAGE PROCESSING (CANVAS COMPRESSION) === */
        function processImage(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    // Kompresja obrazu (max 1024px) - Omija limit Payload Too Large
                    const canvas = document.createElement('canvas');
                    let w = img.width; 
                    let h = img.height;
                    const MAX_DIM = 1024;

                    if (w > h && w > MAX_DIM) { h = Math.round((h * MAX_DIM) / w); w = MAX_DIM; } 
                    else if (h > MAX_DIM) { w = Math.round((w * MAX_DIM) / h); h = MAX_DIM; }

                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);

                    // Konwersja do base64 z kompresją 80%
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
                    
                    document.getElementById('preview-img').src = compressedBase64;
                    document.getElementById('preview-container').classList.remove('hidden');
                    currentBase64 = compressedBase64;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            input.value = '';
        }

        function clearImage() {
            currentBase64 = null;
            document.getElementById('preview-container').classList.add('hidden');
        }

        /* === API CALL LOGIC === */
        async function analyzeMeal() {
            const textDesc = document.getElementById('scan-input').value.trim();
            const apiKey = localStorage.getItem('fitai_api_key');
            
            if (!apiKey) return showToast("Przejdź do Opcji i wpisz klucz API.");
            if (!textDesc && !currentBase64) return showToast("Zrób zdjęcie lub opisz posiłek.");

            const btnText = document.querySelector('#scan-btn span');
            const btnIcon = document.querySelector('#scan-btn i');
            const loader = document.getElementById('scan-loader');
            
            btnText.style.display = 'none';
            btnIcon.style.display = 'none';
            loader.style.display = 'block';

            try {
                // 1. DOKŁADNY URL, O KTÓRY PROSIŁEŚ
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                
                // 2. TWARDY, KRÓTKI PROMPT
                const prompt = `Przeanalizuj posiłek. Zwróć TYLKO kod JSON: {"kcal":0, "protein":0, "carbs":0, "fat":0}. Nic więcej. ${textDesc ? 'Kontekst: ' + textDesc : ''}`;

                let parts = [{ text: prompt }];

                if (currentBase64) {
                    // 4. BEZWZGLĘDNE USUNIĘCIE PREFIKSU Z BASE64
                    const cleanBase64 = currentBase64.replace(/^data:image\/(png|jpeg|jpg);base64,/, '');
                    parts.push({
                        inlineData: {
                            mimeType: "image/jpeg",
                            data: cleanBase64
                        }
                    });
                }

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: parts }],
                        generationConfig: { responseMimeType: "application/json", temperature: 0.1 }
                    })
                });

                if (!response.ok) {
                    const errorDetails = await response.json();
                    throw new Error(errorDetails.error?.message || "Błąd serwera (Status: " + response.status + ")");
                }

                const data = await response.json();
                const responseText = data.candidates[0].content.parts[0].text;
                
                // 3. PARSING PRZEZ REGEX
                const match = responseText.match(/\{[\s\S]*?\}/);
                if (!match) throw new Error("Błąd odczytu: AI nie zwróciło JSONa.");
                
                const result = JSON.parse(match[0]);

                state.kcal += Number(result.kcal) || 0;
                state.protein += Number(result.protein) || 0;
                state.carbs += Number(result.carbs) || 0;
                state.fat += Number(result.fat) || 0;
                
                localStorage.setItem('fitai_state', JSON.stringify(state));
                updateUI();
                showToast(`Dodano ${Number(result.kcal) || 0} kcal!`);
                
                document.getElementById('scan-input').value = '';
                clearImage();
                nav('dashboard');

            } catch (err) {
                console.error(err);
                if (err.message.includes("API key not valid")) showToast("Klucz API jest niepoprawny.");
                else showToast("Wystąpił błąd. Spróbuj ponownie.");
            } finally {
                btnText.style.display = 'block';
                btnIcon.style.display = 'block';
                loader.style.display = 'none';
            }
        }

        /* === HELPERS === */
        function updateUI() {
            document.getElementById('dash-kcal').textContent = Math.round(state.kcal);
            document.getElementById('dash-protein').textContent = Math.round(state.protein);
            document.getElementById('dash-carbs').textContent = Math.round(state.carbs);
            document.getElementById('dash-fat').textContent = Math.round(state.fat);
            
            const progress = Math.min((state.kcal / 2500) * 100, 100);
            const bar = document.getElementById('dash-bar');
            bar.style.width = `${progress}%`;
            
            if (progress > 100) {
                bar.classList.replace('from-emerald-400', 'from-rose-500');
                bar.classList.replace('to-emerald-500', 'to-rose-600');
            }
        }

        function resetData(manual = true) {
            if (manual && !confirm("Rozpocząć od zera?")) return;
            state.kcal = 0; state.protein = 0; state.carbs = 0; state.fat = 0;
            state.date = new Date().toDateString();
            localStorage.setItem('fitai_state', JSON.stringify(state));
            updateUI();
            if(manual) showToast("Nowy dzień rozpoczęty!");
        }

        function saveKey() {
            const key = document.getElementById('api-key').value.trim();
            if (key.length > 5) {
                localStorage.setItem('fitai_api_key', key);
                showToast("Zapisano bezpiecznie!");
                document.getElementById('api-key').value = '';
                document.getElementById('api-key').placeholder = "Klucz zapisany w urządzeniu";
            } else {
                showToast("Wprowadź prawidłowy klucz.");
            }
        }
    </script>
</body>
</html>
